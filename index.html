<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>楓星工具箱</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🍁 楓星工具箱 🍁</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('home')">首頁</button>
        <button class="tab-btn" onclick="switchTab('money-split')">💰 團隊分紅</button>
        <button class="tab-btn" onclick="switchTab('equip-calc')">⚔️ 裝備計算</button>
    </div>

    <div class="content">
        <div id="home" class="tab-content active">
            <h3>歡迎來到楓星工具箱！</h3>
            <p>專為楓之谷玩家打造的便利小工具基地。</p>

            <div class="cloud-box">
                <h4>💾 雲端進度同步（免註冊）</h4>
                <p>輸入你自訂的「自訂字串」，就能在雲端儲存或讀取你的工具箱設定喔！</p>
                <input type="text" id="userKeyCode" class="cloud-input" placeholder="例如：maple123">
                <button class="cloud-btn load" onclick="loadFromCloud()">📥 讀取進度</button>
                <button class="cloud-btn" onclick="saveToCloud()">📤 儲存測試資料</button>
                <p id="cloudStatus" style="color: #64b5f6; font-weight: bold; margin-top: 10px;"></p>
            </div>
        </div>

        <div id="money-split" class="tab-content">
            <h3>💰 團隊分紅計算</h3>
            <p>分錢小工具建置中！</p>
        </div>

 <div id="equip-calc" class="tab-content">
            <h3>⚔️ 裝備綜合計算工具</h3>
            <p style="color: #aaa; margin-bottom: 25px;">全方位反推各項面版數據，點擊下方各工具即可開始計算。</p>
            
            <div class="calc-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; align-items: start;">
                
                <div class="calc-card" style="background-color: #1a1a1a; padding: 20px; border-radius: 8px; border: 1px solid #333;">
                    <h4 style="margin-top: 0; color: #ff6b6b; font-size: 18px; border-bottom: 1px solid #333; padding-bottom: 10px;">⚔️ 基礎攻擊力反推</h4>
                    <p style="color: #aaa; font-size: 13px;">選擇武器並輸入面板與屬性，反推基礎能力。</p>
                    
                    <div style="margin-bottom: 15px;">
                        <label style="display:block; margin-bottom:5px; font-weight:bold;">武器種類 (係數)</label>
                        <select id="coeff" class="cloud-input" style="width: 100%;">
                            <option value="1.75">拳套 (1.75)</option>
                            <option value="1.70">指虎 (1.70)</option>
                            <option value="1.50">手槍 / 大砲 (1.50)</option>
                            <option value="1.49">槍 / 矛 (1.49)</option>
                            <option value="1.35">弩 / 扇子 (1.35)</option>
                            <option value="1.34">雙手武器 - 劍 / 斧 / 棍 (1.34)</option>
                            <option value="1.30">弓 / 短劍 / 雙刀 / 雙弩 / 手杖 (1.30)</option>
                            <option value="1.25">武士刀 (1.25)</option>
                            <option value="1.20" selected>單手武器 - 劍 / 斧 / 棍 (1.20)</option>
                            <option value="1.00">長杖 / 短杖 (1.00)</option>
                        </select>
                    </div>

                    <div style="margin-bottom: 15px;">
                        <label id="lblMain" style="display:block; margin-bottom:5px; font-weight:bold;">主屬性</label>
                        <input type="number" id="mainStat" class="cloud-input" style="width: 100%; box-sizing: border-box;" value="700">
                    </div>

                    <div style="margin-bottom: 15px;">
                        <label id="lblSub" style="display:block; margin-bottom:5px; font-weight:bold;">副屬性</label>
                        <input type="number" id="subStat" class="cloud-input" style="width: 100%; box-sizing: border-box;" value="100">
                    </div>

                    <div style="margin-bottom: 15px;">
                        <label style="display:block; margin-bottom:5px; font-weight:bold;">面板最大表攻</label>
                        <input type="number" id="maxAtk" class="cloud-input" style="width: 100%; box-sizing: border-box;" value="15000">
                    </div>

                    <div style="margin-bottom: 20px;">
                        <label style="display:block; margin-bottom:5px; font-weight:bold;">裝備總攻擊力 %</label>
                        <input type="number" id="percentAtk" class="cloud-input" style="width: 100%; box-sizing: border-box;" value="0">
                    </div>

                    <button class="cloud-btn" onclick="calculateBaseAtk()" style="background-color: #ff6b6b; font-size: 15px; padding: 10px; width:100%; margin: 0 0 15px 0;">立即反推乾淨攻擊力</button>

                    <div style="background-color: #222; border-left: 5px solid #ff6b6b; padding: 12px; border-radius: 0 8px 8px 0; text-align: center;">
                        <div style="font-size: 13px; color: #aaa;">反推基礎攻擊力</div>
                        <div style="font-size: 28px; font-weight: bold; color: #ff6b6b; margin-top: 5px;" id="resultDisplay">0</div>
                    </div>
                </div>

                <div class="calc-card" style="background-color: #1a1a1a; padding: 20px; border-radius: 8px; border: 1px solid #333;">
                    <h4 style="margin-top: 0; color: #4dae4c; font-size: 18px; border-bottom: 1px solid #333; padding-bottom: 10px;">🧬 裝備純屬性反推</h4>
                    <p style="color: #aaa; font-size: 13px;">扣除屬性 % 數與淨能力，反推裝備提供的固定主屬。</p>

                    <div style="margin-bottom: 15px;">
                        <label style="display:block; margin-bottom:5px; font-weight:bold;">面板顯示的【總主屬性】</label>
                        <input type="number" id="statTotal" class="cloud-input" style="width: 100%; box-sizing: border-box;" value="5000">
                    </div>

                    <div style="margin-bottom: 15px;">
                        <label style="display:block; margin-bottom:5px; font-weight:bold;">不吃 % 數的【基礎能力值】</label>
                        <input type="number" id="statBaseOnly" class="cloud-input" style="width: 100%; box-sizing: border-box;" value="1200">
                    </div>

                    <div style="margin-bottom: 74px;"> <label style="display:block; margin-bottom:5px; font-weight:bold;">裝備與潛能的【總主屬性 %】</label>
                        <input type="number" id="statPercent" class="cloud-input" style="width: 100%; box-sizing: border-box;" value="120">
                    </div>

                    <button class="cloud-btn" onclick="calculateEquipStat()" style="background-color: #4dae4c; font-size: 15px; padding: 10px; width:100%; margin: 0 0 15px 0;">立即反推裝備純屬性</button>

                    <div style="background-color: #222; border-left: 5px solid #4dae4c; padding: 12px; border-radius: 0 8px 8px 0; text-align: center;">
                        <div style="font-size: 13px; color: #aaa;">裝備提供的純固定屬性</div>
                        <div style="font-size: 28px; font-weight: bold; color: #4cae4c; margin-top: 5px;" id="equipStatDisplay">0</div>
                    </div>
                </div>

                <div class="calc-card" style="background-color: #1a1a1a; padding: 20px; border-radius: 8px; border: 1px dashed #555; opacity: 0.8;">
                    <h4 style="margin-top: 0; color: #64b5f6; font-size: 18px; border-bottom: 1px dashed #555; padding-bottom: 10px;">🔮 第三類功能（待定）</h4>
                    <p style="color: #aaa; font-size: 13px;">請告訴我第三類你想計算什麼？我們馬上把它填滿！</p>
                    
                    <div style="height: 250px; display: flex; align-items: center; justify-content: center; color: #555; font-style: italic;">
                        功能規劃中...
                    </div>
                </div>

            </div>
        </div>

    <script type="module" src="main.js"></script>
</body>
</html>
