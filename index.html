<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>楓星工具箱</title>
    <style>
        /* 全域暗色背景設定 */
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background-color: #121212; 
            color: #e0e0e0; 
        }
        h1 { color: #ff6b6b; } 
        
        /* 分頁按鈕樣式 */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { 
            padding: 10px 20px; 
            background: #2d2d2d; 
            color: #aaaaaa;
            border: 1px solid #444; 
            cursor: pointer; 
            font-size: 16px; 
            border-radius: 5px; 
        }
        .tab-btn.active { 
            background: #ff6b6b; 
            color: white; 
            border-color: #ff6b6b;
        }
        
        /* 內容框暗色設定 */
        .content { 
            background: #1e1e1e; 
            padding: 20px; 
            border-radius: 5px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
            border: 1px solid #333;
        }
        
        /* 隱藏未選中分頁的設定 */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* 雲端存取區塊樣式 */
        .cloud-box {
            background-color: #251b1b; 
            border: 2px dashed #ff6b6b;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .cloud-input {
            padding: 8px;
            font-size: 16px;
            background-color: #333; 
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            width: 200px;
        }
        .cloud-btn {
            padding: 8px 15px;
            font-size: 14px;
            background-color: #4cae4c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 5px;
        }
        .cloud-btn.load { background-color: #f0ad4e; }
    </style>
</head>
<body>

    <h1>🍁 楓星工具箱 🍁</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('home')">首頁</button>
        <button class="tab-btn" onclick="switchTab('money-split')">💰 團隊分紅</button>
        <button class="tab-btn" onclick="switchTab('equip-calc')">⚔️ 裝備計算</button>
    </div>

    <div class="content">
        <div id="home" class="tab-content active">
            <h3>歡迎來到楓星工具箱！</h3>
            <p>專為楓之谷玩家打造的便利小工具基地。</p>

            <div class="cloud-box">
                <h4>💾 雲端進度同步（免註冊）</h4>
                <p>輸入你自訂的「自訂字串」，就能在雲端儲存或讀取你的工具箱設定喔！</p>
                <input type="text" id="userKeyCode" class="cloud-input" placeholder="例如：maple123">
                <button class="cloud-btn load" onclick="loadFromCloud()">📥 讀取進度</button>
                <button class="cloud-btn" onclick="saveToCloud()">📤 儲存測試資料</button>
                <p id="cloudStatus" style="color: #64b5f6; font-weight: bold; margin-top: 10px;"></p>
            </div>
        </div>

        <div id="money-split" class="tab-content">
            <h3>💰 團隊分紅計算</h3>
            <p>分錢小工具建置中！請把你的範例、想法或對方的網址貼上來，我們馬上動工！</p>
        </div>

        <div id="equip-calc" class="tab-content">
            <h3>⚔️ 裝備屬性計算</h3>
            <p>裝備屬性計算功能建置中！未來可以在這裡點選你的星力、火花、潛能，一鍵算出總屬性！</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyD1dONez4mPFyoQpIgxN0aSGCKYiUvbyxU",
            authDomain: "maplestar-tools.firebaseapp.com",
            projectId: "maplestar-tools",
            storageBucket: "maplestar-tools.firebasestorage.app",
            messagingSenderId: "109052078453",
            appId: "1:109052078453:web:31dd776acaed7ed0828b3c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.saveToCloud = async function() {
            const keyCode = document.getElementById('userKeyCode').value.trim();
            const statusText = document.getElementById('cloudStatus');
            if (!keyCode) { alert('請先輸入一個自訂字串（代碼）再儲存喔！'); return; }
            statusText.innerText = "正在連線到 Google 雲端儲存中...";
            try {
                await setDoc(doc(db, "player_data", keyCode), {
                    userCode: keyCode,
                    lastSaveTime: new Date().toLocaleString(),
                    testMessage: "哈囉！這是你用神祕代碼存在 Google 雲端的測試資料！"
                });
                statusText.innerText = `🎉 儲存成功！時間：${new Date().toLocaleTimeString()}`;
            } catch (error) {
                console.error("儲存失敗：", error);
                statusText.innerText = "❌ 儲存失敗。";
            }
        }

        window.loadFromCloud = async function() {
            const keyCode = document.getElementById('userKeyCode').value.trim();
            const statusText = document.getElementById('cloudStatus');
            if (!keyCode) { alert('請先輸入你要讀取的自訂字串（代碼）！'); return; }
            statusText.innerText = "正在從雲端搜尋你的抽屜...";
            try {
                const docRef = doc(db, "player_data", keyCode);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    alert(`【讀取成功！】\n代碼：${data.userCode}\n最後存檔時間：${data.lastSaveTime}\n雲端內文：${data.testMessage}`);
                    statusText.innerText = `📂 成功讀取代碼 [${keyCode}] 的進度！`;
                } else {
                    statusText.innerText = "❓ 找不到這個代碼的資料。";
                    alert("找不到這個代碼的資料！");
                }
            } catch (error) {
                console.error("讀取失敗：", error);
                statusText.innerText = "❌ 讀取失敗。";
            }
        }

        window.switchTab = function(tabId) {
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(content => content.classList.remove('active'));
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            buttons.forEach(btn => {
                if (btn.getAttribute('onclick').includes(tabId)) { btn.classList.add('active'); }
            });
        }
    </script>
</body>
</html>
