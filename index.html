<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>楓星工具箱</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🍁 楓星工具箱 🍁</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('home')">首頁</button>
        <button class="tab-btn" onclick="switchTab('money-split')">💰 團隊分紅</button>
        <button class="tab-btn" onclick="switchTab('equip-calc')">⚔️ 裝備計算</button>
    </div>

    <div class="content">
        <div id="home" class="tab-content active">
            <h3>歡迎來到楓星工具箱！</h3>
            <p>專為楓之谷玩家打造的便利小工具基地。</p>

            <div class="cloud-box">
                <h4>💾 雲端進度同步（免註冊）</h4>
                <p>輸入你自訂的「自訂字串」，就能在雲端儲存或讀取你的工具箱設定喔！</p>
                <input type="text" id="userKeyCode" class="cloud-input" placeholder="例如：maple123">
                <button class="cloud-btn load" onclick="loadFromCloud()">📥 讀取進度</button>
                <button class="cloud-btn" onclick="saveToCloud()">📤 儲存測試資料</button>
                <p id="cloudStatus" style="color: #64b5f6; font-weight: bold; margin-top: 10px;"></p>
            </div>
        </div>

        <div id="money-split" class="tab-content">
            <h3>💰 團隊分紅計算</h3>
            <p>分錢小工具建置中！請把你的範例、想法或對方的網址貼上來，我們馬上動工！</p>
        </div>

        <div id="equip-calc" class="tab-content">
            <h3>⚔️ 裝備屬性計算</h3>
            <p>裝備屬性計算功能建置中！未來可以在這裡點選你的星力、火花、潛能，一鍵算出總屬性！</p>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
