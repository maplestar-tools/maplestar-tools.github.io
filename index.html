<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>楓星工具箱</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🍁 楓星工具箱 🍁</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('home')">首頁</button>
        <button class="tab-btn" onclick="switchTab('money-split')">💰 團隊分紅</button>
        <button class="tab-btn" onclick="switchTab('equip-calc')">⚔️ 裝備計算</button>
    </div>

    <div class="content">
        <div id="home" class="tab-content active">
            <h3>歡迎來到楓星工具箱！</h3>
            <p>專為楓之谷玩家打造的便利小工具基地。</p>

            <div class="cloud-box">
                <h4>💾 雲端進度同步（免註冊）</h4>
                <p>輸入你自訂的「自訂字串」，就能在雲端儲存或讀取你的工具箱設定喔！</p>
                <input type="text" id="userKeyCode" class="cloud-input" placeholder="例如：maple123">
                <button class="cloud-btn load" onclick="loadFromCloud()">📥 讀取進度</button>
                <button class="cloud-btn" onclick="saveToCloud()">📤 儲存測試資料</button>
                <p id="cloudStatus" style="color: #64b5f6; font-weight: bold; margin-top: 10px;"></p>
            </div>
        </div>

        <div id="money-split" class="tab-content">
            <h3>💰 團隊分紅計算</h3>
            <p>分錢小工具建置中！</p>
        </div>

<div id="equip-calc" class="tab-content">
            <h3>⚔️ 基礎攻擊力反推工具</h3>
            <p style="color: #aaa;">選擇武器並輸入面板與屬性，反推基礎能力！</p>
            
            <div id="weaponGroup" style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom:5px; font-weight:bold;">武器種類 (係數)</label>
                <select id="coeff" class="cloud-input" style="width: 100%; max-width: 350px;" onchange="autoToggleJob()">
                    <option value="1.75">拳套 (1.75)</option>
                    <option value="1.70">指虎 (1.70)</option>
                    <option value="1.50">手槍 / 大砲 (1.50)</option>
                    <option value="1.49">槍 / 矛 (1.49)</option>
                    <option value="1.35">弩 / 扇子 (1.35)</option>
                    <option value="1.34">雙手武器 - 劍 / 斧 / 棍 (1.34)</option>
                    <option value="1.30">弓 / 短劍 / 雙刀 / 雙弩 / 手杖 (1.30)</option>
                    <option value="1.25">武士刀 (1.25)</option>
                    <option value="1.20" selected>單手武器 - 劍 / 斧 / 棍 (1.20)</option>
                    <option value="1.00">長杖 / 短杖 (1.00)</option>
                </select>
            </div>

            <div style="margin-bottom: 15px;">
                <label id="lblMain" style="display:block; margin-bottom:5px; font-weight:bold;">主屬性</label>
                <input type="number" id="mainStat" class="cloud-input" style="width: 100%; max-width: 332px;" value="700">
            </div>

            <div style="margin-bottom: 15px;">
                <label id="lblSub" style="display:block; margin-bottom:5px; font-weight:bold;">副屬性</label>
                <input type="number" id="subStat" class="cloud-input" style="width: 100%; max-width: 332px;" value="100">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom:5px; font-weight:bold;">面板最大表攻</label>
                <input type="number" id="maxAtk" class="cloud-input" style="width: 100%; max-width: 332px;" value="15000">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display:block; margin-bottom:5px; font-weight:bold;">裝備總攻擊力 % </label>
                <input type="number" id="percentAtk" class="cloud-input" style="width: 100%; max-width: 332px;" value="0">
            </div>

            <button class="cloud-btn" onclick="calculateBaseAtk()" style="background-color: #ff6b6b; font-size: 16px; padding: 12px; width:100%; max-width:350px; margin-left:0; margin-bottom:20px;">立即反推乾淨攻擊力</button>

            <div style="background-color: #222; border-left: 5px solid #ff6b6b; padding: 15px; border-radius: 0 8px 8px 0; max-width: 330px; text-align: center;">
                <div style="font-size: 14px; color: #aaa;" id="resTitle">反推基礎攻擊力</div>
                <div style="font-size: 32px; font-weight: bold; color: #ff6b6b; margin-top: 5px;" id="resultDisplay">0</div>
            </div>
        </div>

    <script type="module" src="main.js"></script>
</body>
</html>
